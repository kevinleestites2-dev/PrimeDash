<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>THE PANTHEON | OVERRIDE v7.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Fira+Code:wght@400;700&display=swap');
        
        :root { --red: #ff003c; --cyan: #00f2ff; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* THE NUCLEAR OPTION: EVERYTHING IS FIXED HEIGHT PERCENTAGES */
        html, body { 
            height: 100%; width: 100%; 
            background: #000; color: #fff; font-family: 'Fira Code', monospace;
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* TOP: 8% of screen */
        header {
            height: 8%; background: #000; border-bottom: 2px solid var(--red);
            display: flex; justify-content: space-between; align-items: center; padding: 0 15px;
            font-family: 'Orbitron', sans-serif;
        }

        /* MIDDLE: 77% of screen */
        main {
            height: 77%; display: flex; overflow: hidden;
        }

        .sidebar {
            width: 80px; background: #050505; border-right: 1px solid #111;
            overflow-y: auto; display: flex; flex-direction: column;
        }
        .bot { padding: 15px 5px; border-bottom: 1px solid #111; color: #444; font-size: 7px; text-align: center; }

        .terminal { flex: 1; background: #020202; overflow-y: auto; padding: 15px; font-size: 11px; }

        /* BOTTOM: 15% of screen - HARD CODED */
        footer {
            height: 15%; background: #000; border-top: 2px solid var(--red);
            display: flex; align-items: center; padding: 0 15px;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .box {
            width: 100%; display: flex; gap: 10px; background: #0a0a0a;
            padding: 10px; border: 1px solid #333; border-radius: 5px;
        }
        input {
            flex: 1; background: transparent; border: none; color: var(--cyan); font-size: 16px;
        }
        button {
            background: var(--red); color: #fff; border: none; padding: 10px 20px;
            font-family: 'Orbitron'; font-weight: 900; border-radius: 3px;
        }

        .tag { background: var(--cyan); color: #000; padding: 2px 5px; font-size: 8px; margin-right: 5px; }
    </style>
</head>
<body>
    <header>
        <div style="font-size: 10px;">LIL_BIT</div>
        <div style="font-size: 12px; color: var(--red); letter-spacing: 2px;">OVERRIDE_v7.0</div>
        <div style="font-size: 8px;">STABLE</div>
    </header>

    <main>
        <div class="sidebar" id="side"></div>
        <div class="terminal" id="log">
            <div><span class="tag">SYSTEM</span> PROTOCOL v7.0: NUCLEAR ALIGNMENT. VIEWPORT LOCKED.</div>
        </div>
    </main>

    <footer>
        <div class="box">
            <input type="text" id="in" placeholder="COMMAND...">
            <button onclick="send()">SEND</button>
        </div>
    </footer>

    <script>
        const bots = ["MetaPrime", "OpenPRIME", "MidasPrime", "KratosPrime", "ZapiaPrime", "SolosPrime", "Deep-meta", "EchoPrime", "ZeusPrime", "AlphaPrime", "ZetaPrime", "SentinelPrime", "ScoutPrime", "VanguardPrime", "ChronosPrime", "PrimeDash", "OrionPrime", "OmegaPrime", "Prometheus", "NovaPrime", "NexusPrime"];
        bots.forEach(b => {
            const d = document.createElement('div');
            d.className = 'bot';
            d.innerText = b.toUpperCase();
            document.getElementById('side').appendChild(d);
        });

        function send() {
            const val = document.getElementById('in').value;
            if(!val) return;
            const l = document.getElementById('log');
            const e = document.createElement('div');
            e.innerHTML = `<span class="tag">FM</span> ${val.toUpperCase()}`;
            l.appendChild(e);
            document.getElementById('in').value = '';
            l.scrollTop = l.scrollHeight;
        }
    </script>
</body>
</html>
