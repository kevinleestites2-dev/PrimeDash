<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE PANTHEON | Mission Control</title>
    <style>
        :root { --blue: #00d2ff; --dark: #050505; --card: rgba(20, 25, 35, 0.95); }
        body { background: var(--dark); color: white; font-family: sans-serif; margin: 0; padding: 20px; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .header { text-align: center; margin-bottom: 40px; }
        .title { font-size: 2rem; letter-spacing: 0.3em; text-transform: uppercase; margin: 0; color: white; text-shadow: 0 0 10px var(--blue); }
        .version { font-size: 0.6rem; letter-spacing: 0.5em; color: var(--blue); margin-top: 10px; opacity: 0.7; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 800px; margin: 0 auto; }
        .card { background: var(--card); border: 1px solid rgba(0, 210, 255, 0.3); border-radius: 20px; padding: 20px; text-align: center; cursor: pointer; transition: 0.2s; }
        .card:active { transform: scale(0.95); border-color: var(--blue); box-shadow: 0 0 15px rgba(0, 210, 255, 0.5); }
        .card-title { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; margin: 10px 0 2px 0; }
        .card-role { font-size: 0.5rem; color: #666; text-transform: uppercase; margin: 0; }
        .status { font-size: 0.5rem; color: #00ff88; margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .dot { width: 6px; height: 6px; background: #00ff88; border-radius: 50%; box-shadow: 0 0 5px #00ff88; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card); border: 1px solid var(--blue); border-radius: 30px; width: 100%; max-width: 400px; padding: 30px; text-align: center; }
        .terminal { background: black; border-radius: 15px; height: 150px; margin: 20px 0; padding: 15px; text-align: left; font-family: monospace; font-size: 10px; color: #00ff88; overflow-y: auto; border: 1px solid rgba(255,255,255,0.05); }
        .btn { display: block; width: 100%; padding: 15px; margin-bottom: 10px; background: rgba(0, 210, 255, 0.1); border: 1px solid var(--blue); color: white; border-radius: 15px; font-size: 10px; letter-spacing: 0.2em; cursor: pointer; }
        .btn:active { background: rgba(0, 210, 255, 0.3); }
        .close-btn { color: #555; font-size: 9px; text-transform: uppercase; letter-spacing: 0.3em; margin-top: 20px; border: none; background: none; cursor: pointer; }
        svg { width: 32px; height: 32px; fill: none; stroke: var(--blue); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
</head>
<body>
    <div class="header" onclick="alert('PANTHEON DEBUG: JS IS ACTIVE')">
        <h1 class="title">THE PANTHEON</h1>
        <p class="version">FORGEMASTER COMMAND // v2.4 (HARD-LINKED)</p>
    </div>

    <div class="grid" id="grid"></div>

    <div class="modal" id="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 id="m-title" style="margin:0; letter-spacing: 0.2em;">NAME</h2>
            <p id="m-role" style="font-size: 0.5rem; color: var(--blue); margin-top: 5px; letter-spacing: 0.4em;">ROLE</p>
            <div class="terminal" id="term"></div>
            <button class="btn" onclick="cmd('INITIALIZE')">INITIALIZE</button>
            <button class="btn" onclick="cmd('STATUS')">STATUS CHECK</button>
            <button class="close-btn" onclick="closeModal()">Disconnect</button>
        </div>
    </div>

    <script>
        const bots = [
            {n:"MetaPrime", r:"Architect"}, {n:"OpenPRIME", r:"Orchestrator"},
            {n:"MidasPrime", r:"Treasury"}, {n:"KratosPrime", r:"Enforcer"},
            {n:"ZapiaPrime", r:"Conduit"}, {n:"SolosPrime", r:"Soul"}
        ];
        
        const grid = document.getElementById('grid');
        bots.forEach(b => {
            const d = document.createElement('div');
            d.className = 'card';
            d.onclick = () => openModal(b);
            d.innerHTML = `
                <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                <div class="card-title">${b.n}</div>
                <div class="card-role">${b.r}</div>
                <div class="status"><div class="dot"></div>SYNC'D</div>
            `;
            grid.appendChild(d);
        });

        function openModal(b) {
            document.getElementById('m-title').innerText = b.n;
            document.getElementById('m-role').innerText = b.r;
            document.getElementById('term').innerHTML = '> LINK ESTABLISHED...';
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function cmd(c) {
            const t = document.getElementById('term');
            t.innerHTML += `<br>> SENDING: ${c}...<br>> SUCCESS.`;
            t.scrollTop = t.scrollHeight;
        }
        
        console.log("Pantheon v2.4 Active");
    </script>
</body>
</html>
