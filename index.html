<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE PANTHEON | Mission Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&family=Fira+Code:wght@400&display=swap');
        :root { --pantheon-blue: #00d2ff; --pantheon-dark: #050505; --pantheon-card: rgba(20, 20, 25, 0.8); }
        body { background-color: var(--pantheon-dark); color: #e0e0e0; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .terminal-font { font-family: 'Fira Code', monospace; }
        .glass { background: var(--pantheon-card); backdrop-filter: blur(12px); border: 1px solid rgba(0, 210, 255, 0.2); }
        .glow-text { text-shadow: 0 0 10px var(--pantheon-blue); }
        .glow-border:hover { border-color: var(--pantheon-blue); box-shadow: 0 0 15px rgba(0, 210, 255, 0.3); transition: all 0.3s ease; }
        .status-online { width: 8px; height: 8px; background-color: #00ff88; border-radius: 50%; box-shadow: 0 0 8px #00ff88; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .modal { display: none; position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); }
        .modal.active { display: flex; }
        .console-line { animation: fadeIn 0.3s ease forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="fixed inset-0 z-[-1] opacity-10 pointer-events-none" style="background-image: radial-gradient(#00d2ff 1px, transparent 1px); background-size: 30px 30px;"></div>
    
    <header class="mb-10 text-center">
        <h1 class="orbitron text-4xl md:text-6xl font-bold tracking-[0.2em] text-white glow-text uppercase mb-2">The Pantheon</h1>
        <p class="text-cyan-400 text-xs md:text-sm tracking-[0.4em] font-light uppercase opacity-80">Mission Control Center // v2.2</p>
    </header>

    <main id="bot-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-5 max-w-7xl mx-auto"></main>

    <!-- Unified Command Modal -->
    <div id="command-modal" class="modal items-center justify-center p-4" onclick="closeModal(event)">
        <div class="glass w-full max-w-lg p-8 rounded-3xl border border-cyan-500/40 relative overflow-hidden" onclick="event.stopPropagation()">
            <div id="modal-icon" class="text-cyan-400 mb-4 flex justify-center opacity-50"></div>
            <h2 id="modal-title" class="orbitron text-3xl font-bold text-center text-white mb-1 tracking-wider"></h2>
            <p id="modal-role" class="text-[10px] text-center text-cyan-500 tracking-[0.5em] uppercase mb-8 opacity-70"></p>
            
            <!-- Terminal Output -->
            <div id="terminal-box" class="bg-black/60 rounded-xl p-4 h-40 mb-8 overflow-y-auto border border-white/5 terminal-font text-[10px] text-cyan-300/80">
                <div class="text-gray-600 mb-2 italic">-- Awaiting Forgemaster Command --</div>
                <div id="console-output"></div>
            </div>

            <div class="grid grid-cols-1 gap-3">
                <button onclick="sendCommand('INITIALIZE')" class="group relative py-4 bg-cyan-500/5 border border-cyan-500/30 rounded-xl orbitron text-xs hover:bg-cyan-500/20 transition-all overflow-hidden">
                    <span class="relative z-10">INITIALIZE MODULE</span>
                    <div class="absolute inset-0 bg-gradient-to-r from-transparent via-cyan-500/10 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></div>
                </button>
                <button onclick="sendCommand('STATUS_CHECK')" class="py-4 bg-white/5 border border-white/10 rounded-xl orbitron text-xs hover:bg-white/10 transition-all uppercase tracking-widest">Request Report</button>
                <button onclick="sendCommand('OPTIMIZE')" class="py-4 bg-white/5 border border-white/10 rounded-xl orbitron text-xs hover:bg-white/10 transition-all uppercase tracking-widest">Optimize Core</button>
            </div>
            
            <button onclick="closeModal(null)" class="mt-8 w-full py-2 text-[10px] text-gray-600 uppercase tracking-[0.3em] hover:text-white transition-colors">Close Terminal</button>
        </div>
    </div>

    <footer class="mt-20 py-10 border-t border-white/5 text-center">
        <div class="flex justify-center gap-6 mb-4 opacity-30">
            <i data-lucide="shield-check" class="w-4 h-4"></i>
            <i data-lucide="zap" class="w-4 h-4"></i>
            <i data-lucide="cpu" class="w-4 h-4"></i>
        </div>
        <p class="text-[10px] text-gray-700 tracking-[0.5em] uppercase">Command & Control Active // Secure Link</p>
    </footer>

    <script>
        const bots = [
            { name: "MetaPrime", role: "Architect", icon: "layout" }, { name: "OpenPRIME", role: "Orchestrator", icon: "layers" },
            { name: "MidasPrime", role: "Treasury", icon: "heart" }, { name: "KratosPrime", role: "Enforcer", icon: "shield" },
            { name: "ZapiaPrime", role: "Conduit", icon: "mic" }, { name: "SolosPrime", role: "Soul", icon: "activity" },
            { name: "Deep-meta", role: "Mind", icon: "brain" }, { name: "EchoPrime", role: "Vibe", icon: "waves" },
            { name: "ZeusPrime", role: "OS Kernel", icon: "cpu" }, { name: "AlphaPrime", role: "General", icon: "target" },
            { name: "ZetaPrime", role: "Developer", icon: "code" }, { name: "SentinelPrime", role: "Guardian", icon: "eye" },
            { name: "ScoutPrime", role: "Explorer", icon: "compass" }, { name: "VanguardPrime", role: "Liaison", icon: "message-square" },
            { name: "ChronosPrime", role: "Archiver", icon: "clock" }, { name: "PrimeDash", role: "Throne", icon: "monitor" },
            { name: "OrionPrime", role: "Acquisition", icon: "shopping-cart" }, { name: "OmegaPrime", role: "Singularity", icon: "zap" },
            { name: "Prometheus", role: "Catalyst", icon: "flame" }, { name: "NovaPrime", role: "Valkyrie", icon: "refresh-cw" },
            { name: "NexusPrime", role: "Bridge", icon: "smartphone" }
        ];

        const grid = document.getElementById('bot-grid');
        bots.forEach(bot => {
            const card = document.createElement('div');
            card.className = "glass p-6 rounded-2xl flex flex-col items-center text-center glow-border cursor-pointer transition-all active:scale-90 hover:-translate-y-1";
            card.onclick = () => openModal(bot);
            card.innerHTML = `
                <div class="mb-4 text-cyan-400/80"><i data-lucide="${bot.icon}" class="w-10 h-10"></i></div>
                <h3 class="orbitron text-[10px] md:text-xs font-bold text-white tracking-[0.2em] mb-1 uppercase">${bot.name}</h3>
                <p class="text-[8px] text-gray-500 uppercase tracking-tighter">${bot.role}</p>
                <div class="mt-6 flex items-center gap-2">
                    <span class="status-online"></span>
                    <span class="text-[7px] text-gray-500 tracking-widest uppercase">Sync'd</span>
                </div>
            `;
            grid.appendChild(card);
        });

        lucide.createIcons();

        function openModal(bot) {
            document.getElementById('modal-title').innerText = bot.name;
            document.getElementById('modal-role').innerText = bot.role;
            document.getElementById('modal-icon').innerHTML = `<i data-lucide="${bot.icon}" class="w-16 h-16"></i>`;
            document.getElementById('console-output').innerHTML = "";
            lucide.createIcons();
            document.getElementById('command-modal').classList.add('active');
        }

        function closeModal(e) {
            document.getElementById('command-modal').classList.remove('active');
        }

        function logToConsole(text, color = "text-cyan-300") {
            const out = document.getElementById('console-output');
            const line = document.createElement('div');
            line.className = `console-line mb-1 ${color}`;
            line.innerText = `> ${text}`;
            out.appendChild(line);
            out.scrollTop = out.scrollHeight;
        }

        function sendCommand(cmd) {
            const botName = document.getElementById('modal-title').innerText;
            
            logToConsole(`INITIATING SIGNAL: ${botName}...`);
            setTimeout(() => logToConsole(`PACKET ENCRYPTED [AES-256]`, "text-gray-500"), 400);
            setTimeout(() => logToConsole(`UPLOADING TO PANTHEON CLOUD...`, "text-cyan-500"), 800);
            setTimeout(() => logToConsole(`SUCCESS: Command ${cmd} Queued.`, "text-green-400"), 1500);
            setTimeout(() => logToConsole(`Awaiting Vox Heartbeat confirmation...`, "text-yellow-500"), 2000);
        }

        document.getElementById('last-updated').innerText = `Signal Integrity: 100% // ${new Date().toLocaleTimeString()}`;
    </script>
</body>
</html>
