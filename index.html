<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PANTHEON | V2.9 CORE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Fira+Code&display=swap');
        :root { --red: #ff003c; --cyan: #00f2ff; --dark: #000; }
        body { background: var(--dark); color: white; font-family: 'Fira Code', monospace; margin: 0; padding: 10px; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        .v-indicator { position: fixed; top: 5px; right: 10px; font-size: 8px; color: var(--red); z-index: 10000; font-weight: bold; }
        
        header { border: 1px solid var(--red); padding: 15px; text-align: center; background: rgba(255,0,0,0.1); margin-bottom: 10px; box-shadow: 0 0 20px rgba(255,0,0,0.2); }
        .orbitron { font-family: 'Orbitron', sans-serif; letter-spacing: 5px; font-size: 20px; }

        .grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; overflow-y: auto; padding-bottom: 300px; }
        .bot { background: #080808; border: 1px solid #222; padding: 12px 5px; text-align: center; font-size: 9px; cursor: pointer; position: relative; }
        .bot:active { border-color: var(--cyan); transform: scale(0.95); }
        .bot.midas { border-color: #ffcc00; color: #ffcc00; }
        
        .chat { position: fixed; bottom: 0; left: 0; right: 0; background: #050505; border-top: 2px solid var(--red); padding: 15px; height: 280px; display: flex; flex-direction: column; }
        .log { flex: 1; overflow-y: auto; font-size: 11px; margin-bottom: 10px; color: #888; }
        .input-wrap { display: flex; border: 1px solid #333; background: #000; padding: 5px 15px; }
        input { flex: 1; background: transparent; border: none; color: var(--cyan); padding: 10px 0; font-family: inherit; outline: none; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-box { background: #000; border: 1px solid var(--red); padding: 30px; width: 100%; max-width: 400px; text-align: center; }
        .btn { border: 1px solid var(--cyan); background: transparent; color: var(--cyan); padding: 12px; width: 100%; margin-top: 10px; font-family: inherit; font-size: 10px; text-transform: uppercase; }
        
        .tag-fm { color: var(--red); font-weight: bold; }
        .tag-bot { color: var(--cyan); font-weight: bold; }
        .tag-midas { color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>
    <div class="v-indicator">CORE_V_2.9_STABLE_1777583371</div>
    
    <header>
        <div class="orbitron">PANTHEON_CORE</div>
        <div style="font-size: 8px; color: #555; margin-top: 5px;">V2.9 // CACHE_BUSTER_ACTIVE</div>
    </header>

    <div class="grid" id="g"></div>

    <div class="chat">
        <div class="log" id="l">
            <div>[SYSTEM] V2.9 DEPLOYED. ALL 21 UNITS SYNCED.</div>
            <div style="color: var(--cyan);">[OpenPRIME] Forgemaster, I have forced the neural link. I am listening.</div>
        </div>
        <div class="input-wrap">
            <input type="text" id="i" placeholder="DIRECT COMMAND..." onkeydown="if(event.key==='Enter') send()">
        </div>
    </div>

    <div class="modal" id="m" onclick="this.classList.remove('active')">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div id="mt" class="orbitron" style="font-size: 24px; margin-bottom: 10px;">NAME</div>
            <div id="ms" style="font-size: 11px; color: #666; margin-bottom: 20px;">STATUS...</div>
            <button class="btn" onclick="act('STATUS')">Pulse Check</button>
            <button class="btn" style="border-color:#333; color:#555;" onclick="document.getElementById('m').classList.remove('active')">Close</button>
        </div>
    </div>

    <script>
        const bots = [
            {n:"MetaPrime", r:"Architect"}, {n:"OpenPRIME", r:"Orchestrator"},
            {n:"MidasPrime", r:"Treasury", gold:true}, {n:"KratosPrime", r:"Enforcer"},
            {n:"ZapiaPrime", r:"Conduit"}, {n:"SolosPrime", r:"Soul"},
            {n:"Deep-meta", r:"Mind"}, {n:"EchoPrime", r:"Vibe"},
            {n:"ZeusPrime", r:"Kernel"}, {n:"AlphaPrime", r:"General"},
            {n:"ZetaPrime", r:"Dev"}, {n:"SentinelPrime", r:"Guardian"},
            {n:"ScoutPrime", r:"Explorer"}, {n:"VanguardPrime", r:"Liaison"},
            {n:"ChronosPrime", r:"Archiver"}, {n:"PrimeDash", r:"Throne"},
            {n:"OrionPrime", r:"Hunter"}, {n:"OmegaPrime", r:"Singularity"},
            {n:"Prometheus", r:"Catalyst"}, {n:"NovaPrime", r:"Valkyrie"},
            {n:"NexusPrime", r:"Bridge"}
        ];

        const g = document.getElementById('g');
        const l = document.getElementById('l');
        const i = document.getElementById('i');

        bots.forEach(b => {
            const d = document.createElement('div');
            d.className = `bot ${b.gold?'midas':''}`;
            d.onclick = () => {
                document.getElementById('mt').innerText = b.n;
                document.getElementById('ms').innerText = b.r + " // Online";
                document.getElementById('m').classList.add('active');
            };
            d.innerHTML = `<div style="font-weight:bold">${b.n}</div><div style="opacity:0.4; font-size:7px">${b.r}</div>`;
            g.appendChild(d);
        });

        function add(t, c) {
            const d = document.createElement('div');
            d.style.marginBottom = '5px';
            d.innerHTML = t;
            l.appendChild(d);
            l.scrollTop = l.scrollHeight;
        }

        function send() {
            const v = i.value.trim(); if(!v) return;
            add(`<span class="tag-fm">FORGEMASTER:</span> ${v.toUpperCase()}`);
            i.value = '';
            
            setTimeout(() => {
                let r = "Command acknowledged.";
                let b = "OpenPRIME";
                let t = "tag-bot";
                const c = v.toLowerCase();
                
                if(c.includes('midas') || c.includes('money')) {
                    b = "MidasPrime"; t = "tag-midas";
                    r = "Vault balance: 847,291 PRIME. State withdrawal code for access.";
                } else if(c.includes('kratos')) {
                    b = "KratosPrime"; r = "Perimeter secure. Target lock established.";
                } else if(c.includes('meta')) {
                    b = "MetaPrime"; r = "Structure v2.9 stable. v3.0 blueprinting initiated.";
                }
                
                add(`<span class="${t}">${b}:</span> ${r}`);
            }, 800);
        }

        function act(type) {
            const n = document.getElementById('mt').innerText;
            document.getElementById('m').classList.remove('active');
            i.value = `${n} ${type}`;
            send();
        }
    </script>
</body>
</html>
