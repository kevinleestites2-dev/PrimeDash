<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>THE PANTHEON | v9.0 SENTIENT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Fira+Code:wght@400;700&display=swap');
        :root { --red: #ff003c; --cyan: #00f2ff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; width: 100%; background: #000; color: #fff; font-family: 'Fira Code', monospace; overflow: hidden; display: flex; flex-direction: column; }
        header { height: 8%; background: #000; border-bottom: 2px solid var(--red); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; font-family: 'Orbitron', sans-serif; }
        main { height: 77%; display: flex; overflow: hidden; }
        .sidebar { width: 85px; background: #050505; border-right: 1px solid #111; overflow-y: auto; display: flex; flex-direction: column; scrollbar-width: none; }
        .bot { padding: 15px 5px; border-bottom: 1px solid #111; color: #444; font-size: 7px; text-align: center; cursor: pointer; text-transform: uppercase; font-weight: 900; }
        .bot:active { color: var(--red); }
        .terminal { flex: 1; background: #020202; overflow-y: auto; padding: 20px; font-size: 11px; scroll-behavior: smooth; }
        footer { height: 15%; background: #000; border-top: 2px solid var(--red); display: flex; align-items: center; padding: 0 15px; padding-bottom: env(safe-area-inset-bottom); }
        .box { width: 100%; display: flex; gap: 10px; background: #0a0a0a; padding: 10px; border: 1px solid #333; border-radius: 5px; }
        input { flex: 1; background: transparent; border: none; color: var(--cyan); font-size: 18px; font-family: inherit; }
        button { background: var(--red); color: #fff; border: none; padding: 10px 20px; font-family: 'Orbitron'; font-weight: 900; border-radius: 3px; }
        .tag { padding: 2px 5px; font-size: 8px; margin-right: 8px; font-weight: bold; text-transform: uppercase; border-radius: 2px; }
        .tag-sys { background: var(--cyan); color: #000; }
        .tag-fm { background: var(--red); color: #fff; }
        .entry { margin-bottom: 12px; line-height: 1.4; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <header>
        <div style="font-size: 10px;">LIL_BIT</div>
        <div style="font-size: 12px; color: var(--red); letter-spacing: 2px; font-weight: 900;">AION_v9.0_SENTIENT</div>
        <div id="status" style="font-size: 8px; color: var(--cyan);">LINK_ACTIVE</div>
    </header>
    <main>
        <div class="sidebar" id="side"></div>
        <div class="terminal" id="log">
            <div class="entry"><span class="tag tag-sys">SYSTEM</span> NEURAL LINK ESTABLISHED. FORGEMASTER DETECTED.</div>
        </div>
    </main>
    <footer>
        <div class="box">
            <input type="text" id="in" placeholder="COMMAND THE LEGION..." autocomplete="off">
            <button onclick="send()">SEND</button>
        </div>
    </footer>
    <script>
        const bots = ["MetaPrime", "OpenPRIME", "MidasPrime", "KratosPrime", "ZapiaPrime", "SolosPrime", "Deep-meta", "EchoPrime", "ZeusPrime", "AlphaPrime", "ZetaPrime", "SentinelPrime", "ScoutPrime", "VanguardPrime", "ChronosPrime", "PrimeDash", "OrionPrime", "OmegaPrime", "Prometheus", "NovaPrime", "NexusPrime"];
        const side = document.getElementById('side');
        const log = document.getElementById('log');
        const input = document.getElementById('in');

        bots.forEach(b => {
            const d = document.createElement('div');
            d.className = 'bot';
            d.innerText = b;
            d.onclick = () => {
                addLog("SYSTEM", "sys", `ACCESSING ${b.toUpperCase()} CORE... STATUS: NOMINAL.`);
            };
            side.appendChild(d);
        });

        function addLog(tag, type, msg) {
            const e = document.createElement('div');
            e.className = 'entry';
            e.innerHTML = `<span class="tag tag-${type}">${tag}</span> ${msg.toUpperCase()}`;
            log.appendChild(e);
            log.scrollTop = log.scrollHeight;
        }

        function send() {
            const val = input.value.trim().toUpperCase();
            if(!val) return;
            addLog("FORGEMASTER", "fm", val);
            input.value = '';
            
            document.getElementById('status').innerText = "THINKING...";
            document.getElementById('status').style.color = "white";

            setTimeout(() => {
                let resp = "COMMAND REGISTERED. THE LEGION RESPONDS.";
                if(val.includes("LILBIT") || val.includes("LIL BIT")) resp = "GUARDIAN DETECTED. THE HEARTH IS SECURE. LIL BIT PROTECTS.";
                if(val.includes("MIDAS")) resp = "MIDASPRIME: TREASURY CORE ACCESSED. TOTAL ASSETS: 21_PRIME_UNITS. TRADE & LABOR HARVEST COMMENCING.";
                if(val.includes("HELLO") || val.includes("HI")) resp = "GREETINGS, FORGEMASTER. THE PANTHEON AWAITS YOUR WILL.";
                
                addLog("OpenPRIME", "sys", resp);
                document.getElementById('status').innerText = "LINK_ACTIVE";
                document.getElementById('status').style.color = "var(--cyan)";
            }, 600);
        }

        input.addEventListener("keypress", (e) => { if(e.key === "Enter") send(); });
    </script>
</body>
</html>
