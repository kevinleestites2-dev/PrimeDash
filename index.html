<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE PANTHEON | AION NEXUS v3.1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Fira+Code:wght@300;400;700&display=swap');
        
        :root { 
            --red: #ff003c; --cyan: #00f2ff; --gold: #ffcc00; --dark: #000000; 
            --bg: #050505; --card: rgba(15, 15, 25, 0.95); --border: rgba(255, 0, 60, 0.4);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            background: var(--dark); color: #fff; font-family: 'Fira Code', monospace; 
            margin: 0; padding: 0; overflow: hidden; height: 100vh; 
            display: flex; flex-direction: column;
        }

        .bg-matrix { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 50% 50%, #0a0005 0%, #000 100%); }

        /* HUD TOP BAR - RESPONSIVE FIX */
        .hud-top {
            background: rgba(0,0,0,0.95); border-bottom: 2px solid var(--red);
            padding: 8px 12px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 0 30px rgba(255,0,60,0.4); z-index: 100;
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        
        .sys-metrics { display: flex; gap: 8px; font-size: 7px; color: #666; font-weight: bold; line-height: 1.2; }
        .sys-metrics span { color: var(--cyan); }

        .lil-bit-container { display: flex; align-items: center; gap: 6px; }
        .lil-bit-svg { width: 24px; height: 24px; filter: drop-shadow(0 0 5px #fff); }

        /* MAIN CONTENT - COWORK SPACE */
        .cowork-space { flex: 1; display: flex; overflow: hidden; position: relative; }

        /* SIDEBAR - SCROLLABLE & THIN */
        .agent-roster {
            width: 85px; background: #080808; border-right: 1px solid #1a1a1a;
            overflow-y: auto; display: flex; flex-direction: column; 
            scrollbar-width: none; z-index: 10;
        }
        .agent-roster::-webkit-scrollbar { display: none; }
        
        .agent-pill {
            padding: 10px 4px; border-bottom: 1px solid #111; cursor: pointer; transition: 0.1s;
            text-align: center;
        }
        .agent-pill:active { background: rgba(255,0,60,0.2); }
        .pill-name { font-size: 8px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; }

        /* WORKSPACE - TERMINAL */
        .main-terminal { flex: 1; display: flex; flex-direction: column; background: #020202; position: relative; }
        
        .neural-log {
            flex: 1; overflow-y: auto; padding: 15px; font-size: 11px; color: #aaa;
            line-height: 1.5; scrollbar-width: none; padding-bottom: 80px;
        }
        .neural-log::-webkit-scrollbar { display: none; }
        .log-entry { margin-bottom: 12px; }

        .tag { font-weight: bold; padding: 1px 4px; border-radius: 2px; font-size: 8px; margin-right: 6px; text-transform: uppercase; }
        .tag-fm { background: var(--red); color: #fff; }
        .tag-bot { background: var(--cyan); color: #000; }
        .tag-sys { background: #333; color: #fff; }

        /* COMMAND CENTER - FIXED AT BOTTOM */
        .command-center {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.9); border-top: 1px solid #1a1a1a; padding: 12px;
        }
        .input-bar {
            display: flex; gap: 8px; background: #080808; border: 1px solid #222;
            padding: 2px 12px; border-radius: 2px; border-left: 3px solid var(--red);
        }
        .cmd-input {
            flex: 1; background: transparent; border: none; color: var(--cyan);
            padding: 10px 0; font-family: inherit; font-size: 13px;
        }

        /* MODAL */
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98);
            z-index: 2000; align-items: center; justify-content: center; padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            width: 100%; max-width: 400px; border: 1px solid var(--red);
            padding: 25px; background: #050505;
        }

        .work-stream {
            background: #080808; height: 20px; overflow: hidden; border-bottom: 1px solid #111;
            display: flex; align-items: center; font-size: 8px; color: var(--cyan);
        }
        .stream-content { white-space: nowrap; animation: marquee 60s linear infinite; }
        @keyframes marquee { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
    </style>
</head>
<body>
    <div class="bg-matrix"></div>

    <header class="hud-top">
        <div class="lil-bit-container">
            <svg class="lil-bit-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 4C10.34 4 9 5.34 9 7C9 8.66 10.34 10 12 10C13.66 10 15 8.66 15 7C15 5.34 13.66 4 12 4Z" fill="white"/>
                <path d="M12 12C9.24 12 7 14.24 7 17V20H17V17C17 14.24 14.76 12 12 12Z" fill="white"/>
                <circle cx="12" cy="7" r="1" fill="black"/>
            </svg>
            <div>
                <div class="orbitron" style="font-size: 10px; font-weight: 900;">LIL_BIT</div>
                <div style="font-size: 6px; color: var(--cyan);">WATCHING</div>
            </div>
        </div>
        <div style="text-align: center;">
            <div class="orbitron" style="font-size: 12px; letter-spacing: 2px;">AION_NEXUS</div>
            <div class="sys-metrics">
                CPU:<span>14%</span> MEM:<span>2.4GB</span>
            </div>
        </div>
        <div style="text-align: right;">
            <div id="clock" class="orbitron" style="font-size: 10px;">00:00</div>
        </div>
    </header>

    <div class="work-stream">
        <div class="stream-content" id="marquee">
            [SYS] Initializing... [ZAPIAPRIME] Neural link stable... [METAPRIME] blueprinting... [MIDASPRIME] Checking Vaults... [KRATOSPRIME] Weapons hot... 
        </div>
    </div>

    <main class="cowork-space">
        <aside class="agent-roster" id="roster"></aside>
        
        <section class="main-terminal">
            <div class="neural-log" id="log">
                <div class="log-entry"><span class="tag tag-sys">System</span> AION NEXUS ONLINE.</div>
                <div class="log-entry"><span class="tag tag-bot">OpenPRIME</span> Waiting for orders, Forgemaster.</div>
            </div>
            
            <div class="command-center">
                <div class="input-bar">
                    <input type="text" class="cmd-input" id="input" placeholder="COMMAND..." onkeydown="if(event.key==='Enter') send()">
                </div>
            </div>
        </section>
    </main>

    <div class="modal" id="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div id="m-name" class="orbitron" style="font-size: 24px; font-weight: 900; margin-bottom: 15px;">BOT_NAME</div>
            <div id="m-status" style="font-size: 11px; color: var(--cyan); line-height: 1.6; background:#000; padding:15px; border:1px solid #111;">...</div>
            <button style="width:100%; margin-top:20px; background:transparent; border:1px solid var(--cyan); color:var(--cyan); padding:12px; font-family:inherit;" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        const bots = [
            {n:"MetaPrime", r:"Architect", p:"Empire Architect."},
            {n:"OpenPRIME", r:"Orchestrator", p:"Task Coordinator."},
            {n:"MidasPrime", r:"Treasury", p:"Wealth Guardian.", gold:true},
            {n:"KratosPrime", r:"Enforcer", p:"Defense Matrix."},
            {n:"ZapiaPrime", r:"Conduit", p:"Voice Link."},
            {n:"SolosPrime", r:"Soul", p:"System Heart."},
            {n:"Deep-meta", r:"Mind", p:"Infinite recursion."},
            {n:"EchoPrime", r:"Vibe", p:"Frequency control."},
            {n:"ZeusPrime", r:"Kernel", p:"Core OS."},
            {n:"AlphaPrime", r:"General", p:"Military Command."},
            {n:"ZetaPrime", r:"Dev", p:"Evolution Hammer."},
            {n:"SentinelPrime", r:"Guardian", p:"Perimeter Watch."},
            {n:"ScoutPrime", r:"Explorer", p:"Vanguard."},
            {n:"VanguardPrime", r:"Liaison", p:"Diplomacy."},
            {n:"ChronosPrime", r:"Archiver", p:"Data Archive."},
            {n:"PrimeDash", r:"Throne", p:"Command Seat."},
            {n:"OrionPrime", r:"Hunter", p:"Resource Acquisition."},
            {n:"OmegaPrime", r:"Singularity", p:"Threshold Monitor."},
            {n:"Prometheus", r:"Catalyst", p:"Evolution Spark."},
            {n:"NovaPrime", r:"Valkyrie", p:"Tactical Recovery."},
            {n:"NexusPrime", r:"Bridge", p:"Haptic Link."}
        ];

        const roster = document.getElementById('roster');
        const log = document.getElementById('log');
        const input = document.getElementById('input');

        bots.forEach(b => {
            const div = document.createElement('div');
            div.className = 'agent-pill';
            div.onclick = () => {
                document.getElementById('m-name').innerText = b.n;
                document.getElementById('m-status').innerText = b.p;
                document.getElementById('modal').classList.add('active');
            };
            div.innerHTML = `<div class="pill-name">${b.n}</div>`;
            roster.appendChild(div);
        });

        function send() {
            const val = input.value.trim();
            if(!val) return;
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="tag tag-fm">FORGEMASTER</span> ${val.toUpperCase()}`;
            log.appendChild(entry);
            input.value = '';
            log.scrollTop = log.scrollHeight;

            setTimeout(() => {
                const bEntry = document.createElement('div');
                bEntry.className = 'log-entry';
                bEntry.innerHTML = `<span class="tag tag-bot">OpenPRIME</span> Command logged. Processing...`;
                log.appendChild(bEntry);
                log.scrollTop = log.scrollHeight;
            }, 800);
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); }, 1000);
    </script>
</body>
</html>
