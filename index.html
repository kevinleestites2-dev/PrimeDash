<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>THE PANTHEON | AION v3.9</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Fira+Code:wght@400;700&display=swap');
        
        :root { 
            --red: #ff003c; --cyan: #00f2ff; --gold: #ffcc00; --dark: #000000; 
            --bg: #050505; --border: rgba(255, 0, 60, 1);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            background: var(--dark); color: #fff; font-family: 'Fira Code', monospace; 
            margin: 0; padding: 0; overflow: hidden; height: 100vh; 
            display: flex; flex-direction: column;
        }

        /* HUD - TOP BAR */
        .hud-top {
            height: 60px; background: #000; border-bottom: 2px solid var(--red);
            padding: 0 15px; z-index: 1000; display: flex; justify-content: space-between; align-items: center;
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        
        /* THE STABILIZER - FLEXIBLE CENTER AREA */
        .cowork-space { 
            flex: 1; display: flex; overflow: hidden; 
            margin-bottom: 80px; /* HARD SPACE FOR CHAT */
        }

        /* SIDEBAR */
        .agent-roster {
            width: 80px; background: #050505; border-right: 1px solid #111;
            overflow-y: auto; display: flex; flex-direction: column; scrollbar-width: none;
        }
        .agent-pill { padding: 15px 2px; border-bottom: 1px solid #111; cursor: pointer; text-align: center; color: #444; }
        .pill-name { font-size: 8px; font-weight: 900; }

        /* TERMINAL */
        .main-terminal { flex: 1; display: flex; flex-direction: column; background: #020202; overflow: hidden; }
        .neural-log { flex: 1; overflow-y: auto; padding: 15px; font-size: 11px; color: #bbb; line-height: 1.5; }
        .log-entry { margin-bottom: 15px; }
        .tag { font-weight: bold; padding: 2px 5px; border-radius: 2px; font-size: 7px; margin-right: 7px; text-transform: uppercase; }
        .tag-fm { background: var(--red); color: #fff; }
        .tag-bot { background: var(--cyan); color: #000; }

        /* COMMAND HUB - THE ANCHOR v3.9 */
        .command-hub {
            position: fixed; 
            bottom: 0; left: 0; right: 0;
            height: 80px;
            background: #000; 
            border-top: 1px solid var(--red);
            padding: 10px 15px calc(10px + env(safe-area-inset-bottom));
            z-index: 9999;
            display: flex; align-items: center;
        }
        .input-bar {
            width: 100%; display: flex; gap: 10px; background: #080808;
            padding: 0 12px; border-radius: 4px; border: 1px solid #222;
            align-items: center;
        }
        .cmd-input {
            flex: 1; background: transparent; border: none; color: var(--cyan);
            padding: 15px 0; font-family: inherit; font-size: 16px;
        }
        .send-btn {
            background: var(--red); color: white; border: none; border-radius: 3px;
            padding: 10px 15px; font-family: 'Orbitron', sans-serif; font-size: 10px;
            font-weight: 900; cursor: pointer;
        }

        .ver-tag { position: fixed; top: 2px; left: 5px; font-size: 5px; color: #222; z-index: 1000; }
    </style>
</head>
<body>
    <div class="ver-tag">v3.9_ANCHORED</div>

    <header class="hud-top">
        <div class="orbitron" style="font-size: 10px; font-weight: 900;">LIL_BIT</div>
        <div class="orbitron" style="font-size: 12px; letter-spacing: 2px; color: var(--red); font-weight: 900;">AION_NEXUS</div>
        <div style="font-size: 8px; color: #444;">14% CPU</div>
    </header>

    <main class="cowork-space">
        <aside class="agent-roster" id="roster"></aside>
        <section class="main-terminal">
            <div class="neural-log" id="log">
                <div class="log-entry"><span class="tag tag-bot">OpenPRIME</span> Forgemaster, v3.9 deployed. Fixed height containers locked. The Command Hub is now physically part of the OS-level bottom bar.</div>
            </div>
        </section>
    </main>

    <div class="command-hub">
        <div class="input-bar">
            <input type="text" class="cmd-input" id="input" placeholder="COMMAND..." onkeydown="if(event.key==='Enter') send()">
            <button class="send-btn" onclick="send()">SEND</button>
        </div>
    </div>

    <script>
        const bots = ["MetaPrime", "OpenPRIME", "MidasPrime", "KratosPrime", "ZapiaPrime", "SolosPrime", "Deep-meta", "EchoPrime", "ZeusPrime", "AlphaPrime", "ZetaPrime", "SentinelPrime", "ScoutPrime", "VanguardPrime", "ChronosPrime", "PrimeDash", "OrionPrime", "OmegaPrime", "Prometheus", "NovaPrime", "NexusPrime"];
        const roster = document.getElementById('roster');
        const log = document.getElementById('log');
        const input = document.getElementById('input');

        bots.forEach(b => {
            const div = document.createElement('div');
            div.className = 'agent-pill';
            div.innerHTML = `<div class="pill-name">${b}</div>`;
            roster.appendChild(div);
        });

        function send() {
            const val = input.value.trim();
            if(!val) return;
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="tag tag-fm">FORGEMASTER</span> ${val.toUpperCase()}`;
            log.appendChild(entry);
            input.value = '';
            log.scrollTop = log.scrollHeight;
        }
    </script>
</body>
</html>
