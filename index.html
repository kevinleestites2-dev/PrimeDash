<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE PANTHEON | Mission Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap');
        :root { --pantheon-blue: #00d2ff; --pantheon-dark: #050505; --pantheon-card: rgba(20, 20, 25, 0.7); }
        body { background-color: var(--pantheon-dark); color: #e0e0e0; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .glass { background: var(--pantheon-card); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glow-text { text-shadow: 0 0 10px var(--pantheon-blue), 0 0 20px var(--pantheon-blue); }
        .glow-border:hover { border-color: var(--pantheon-blue); box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); transition: all 0.3s ease; }
        .status-online { width: 8px; height: 8px; background-color: #00ff88; border-radius: 50%; box-shadow: 0 0 8px #00ff88; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .modal { display: none; position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
        .modal.active { display: flex; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="fixed inset-0 z-[-1] opacity-10 pointer-events-none" style="background-image: radial-gradient(#00d2ff 1px, transparent 1px); background-size: 30px 30px;"></div>
    
    <header class="mb-8 text-center">
        <h1 class="orbitron text-3xl md:text-5xl font-bold tracking-widest text-white glow-text uppercase mb-2">The Pantheon</h1>
        <p class="text-cyan-400 text-xs md:text-sm tracking-[0.3em] font-light uppercase opacity-80">Mission Control Center // v2.1</p>
    </header>

    <main id="bot-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 max-w-7xl mx-auto"></main>

    <!-- Command Modal -->
    <div id="command-modal" class="modal items-center justify-center p-4" onclick="closeModal(event)">
        <div class="glass w-full max-w-md p-6 rounded-2xl border border-cyan-500/30" onclick="event.stopPropagation()">
            <div id="modal-icon" class="text-cyan-400 mb-4 flex justify-center"></div>
            <h2 id="modal-title" class="orbitron text-2xl font-bold text-center text-white mb-1"></h2>
            <p id="modal-role" class="text-xs text-center text-cyan-500 tracking-widest uppercase mb-6"></p>
            
            <div class="space-y-3">
                <button onclick="sendCommand('INITIALIZE')" class="w-full py-3 bg-cyan-500/10 border border-cyan-500/50 rounded-lg orbitron text-xs hover:bg-cyan-500/20 transition-all">INITIALIZE MODULE</button>
                <button onclick="sendCommand('STATUS_CHECK')" class="w-full py-3 bg-white/5 border border-white/10 rounded-lg orbitron text-xs hover:bg-white/10 transition-all">REQUEST STATUS REPORT</button>
                <button onclick="sendCommand('OPTIMIZE')" class="w-full py-3 bg-white/5 border border-white/10 rounded-lg orbitron text-xs hover:bg-white/10 transition-all">RUN OPTIMIZATION</button>
            </div>
            
            <button onclick="closeModal(null)" class="mt-8 w-full py-2 text-[10px] text-gray-500 uppercase tracking-widest hover:text-white transition-colors">Close Terminal</button>
        </div>
    </div>

    <footer class="mt-12 py-8 border-t border-white/5 text-center">
        <p class="text-xs text-gray-600 tracking-widest uppercase mb-2">Command & Control Active</p>
        <p id="last-updated" class="text-[10px] text-gray-700 uppercase">Awaiting Signal...</p>
    </footer>

    <script>
        const bots = [
            { name: "MetaPrime", role: "Architect", icon: "layout" }, { name: "OpenPRIME", role: "Orchestrator", icon: "layers" },
            { name: "MidasPrime", role: "Treasury", icon: "heart" }, { name: "KratosPrime", role: "Enforcer", icon: "shield" },
            { name: "ZapiaPrime", role: "Conduit", icon: "mic" }, { name: "SolosPrime", role: "Soul", icon: "activity" },
            { name: "Deep-meta", role: "Mind", icon: "brain" }, { name: "EchoPrime", role: "Vibe", icon: "waves" },
            { name: "ZeusPrime", role: "OS Kernel", icon: "cpu" }, { name: "AlphaPrime", role: "General", icon: "target" },
            { name: "ZetaPrime", role: "Developer", icon: "code" }, { name: "SentinelPrime", role: "Guardian", icon: "eye" },
            { name: "ScoutPrime", role: "Explorer", icon: "compass" }, { name: "VanguardPrime", role: "Liaison", icon: "message-square" },
            { name: "ChronosPrime", role: "Archiver", icon: "clock" }, { name: "PrimeDash", role: "Throne", icon: "monitor" },
            { name: "OrionPrime", role: "Acquisition", icon: "shopping-cart" }, { name: "OmegaPrime", role: "Singularity", icon: "zap" },
            { name: "Prometheus", role: "Catalyst", icon: "flame" }, { name: "NovaPrime", role: "Valkyrie", icon: "refresh-cw" },
            { name: "NexusPrime", role: "Bridge", icon: "smartphone" }
        ];

        const grid = document.getElementById('bot-grid');
        bots.forEach(bot => {
            const card = document.createElement('div');
            card.className = "glass p-4 rounded-xl flex flex-col items-center text-center glow-border cursor-pointer transition-transform active:scale-95";
            card.onclick = () => openModal(bot);
            card.innerHTML = `
                <div class="mb-3 text-cyan-400 opacity-80"><i data-lucide="${bot.icon}" class="w-8 h-8"></i></div>
                <h3 class="orbitron text-xs md:text-sm font-bold text-white tracking-wider mb-1">${bot.name}</h3>
                <p class="text-[10px] text-gray-500 uppercase tracking-tighter">${bot.role}</p>
                <div class="mt-4 flex items-center gap-1">
                    <span class="status-online"></span>
                    <span class="text-[8px] text-gray-400">ACTIVE</span>
                </div>
            `;
            grid.appendChild(card);
        });

        lucide.createIcons();

        function openModal(bot) {
            document.getElementById('modal-title').innerText = bot.name;
            document.getElementById('modal-role').innerText = bot.role;
            document.getElementById('modal-icon').innerHTML = `<i data-lucide="${bot.icon}" class="w-12 h-12"></i>`;
            lucide.createIcons();
            document.getElementById('command-modal').classList.add('active');
        }

        function closeModal(e) {
            document.getElementById('command-modal').classList.remove('active');
        }

        function sendCommand(cmd) {
            const botName = document.getElementById('modal-title').innerText;
            alert(`Signal Sent: ${botName} -> ${cmd}`);
            // In the next step, this will write to a JSON file in GitHub
            closeModal();
        }

        document.getElementById('last-updated').innerText = `Last Signal: ${new Date().toLocaleTimeString()}`;
    </script>
</body>
</html>
