<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>THE PANTHEON | RED MAGIC v3.8</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Fira+Code:wght@400;700&display=swap');
        
        :root { 
            --red: #ff003c; --cyan: #00f2ff; --gold: #ffcc00; --dark: #000000; 
            --bg: #050505; --border: rgba(255, 0, 60, 1);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            background: var(--dark); color: #fff; font-family: 'Fira Code', monospace; 
            margin: 0; padding: 0; overflow: hidden; height: 100vh; 
            display: flex; flex-direction: column;
        }

        .bg-matrix { position: fixed; inset: 0; z-index: -1; background: #000; }

        /* HUD - RED MAGIC EDITION */
        .hud-top {
            background: #000; border-bottom: 2px solid var(--red);
            padding: 10px 15px; z-index: 1000;
            display: grid;
            grid-template-columns: 80px 1fr 80px;
            align-items: center;
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.3);
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        
        .sys-metrics { font-size: 7px; color: #555; font-weight: bold; text-align: right; line-height: 1.2; }
        .sys-metrics span { color: var(--cyan); }

        /* MAIN CONTENT AREA */
        .cowork-space { 
            flex: 1; display: flex; overflow: hidden; 
            position: relative;
        }

        /* SIDEBAR - ULTRA NARROW */
        .agent-roster {
            width: 75px; background: #050505; border-right: 1px solid #1a1a1a;
            overflow-y: auto; display: flex; flex-direction: column; scrollbar-width: none;
        }
        .agent-roster::-webkit-scrollbar { display: none; }
        .agent-pill { padding: 12px 2px; border-bottom: 1px solid #111; cursor: pointer; text-align: center; color: #333; }
        .agent-pill:active { color: #fff; background: rgba(255,0,60,0.1); }
        .pill-name { font-size: 7.5px; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; }

        /* TERMINAL LOG */
        .main-terminal { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        
        .neural-log {
            flex: 1; overflow-y: auto; padding: 15px; font-size: 11px; color: #bbb;
            line-height: 1.5; padding-bottom: 100px; /* SPACE FOR FIXED CHAT */
        }
        .log-entry { margin-bottom: 15px; }

        .tag { font-weight: bold; padding: 2px 5px; border-radius: 2px; font-size: 7px; margin-right: 7px; text-transform: uppercase; }
        .tag-fm { background: var(--red); color: #fff; }
        .tag-bot { background: var(--cyan); color: #000; }

        /* COMMAND HUB - DEFINITIVE FIX */
        .command-hub {
            position: fixed; 
            bottom: 0; left: 0; right: 0;
            background: #000; 
            border-top: 2px solid var(--red);
            padding: 12px 15px calc(12px + env(safe-area-inset-bottom));
            z-index: 5000;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.9);
        }
        .input-bar {
            display: flex; gap: 8px; background: #0a0a0a;
            padding: 0 10px; border-radius: 4px; border: 1px solid #222;
            align-items: center;
        }
        .cmd-input {
            flex: 1; background: transparent; border: none; color: var(--cyan);
            padding: 12px 0; font-family: inherit; font-size: 15px;
        }
        .send-btn {
            background: var(--red); color: white; border: none; border-radius: 3px;
            padding: 8px 12px; font-family: 'Orbitron', sans-serif; font-size: 9px;
            font-weight: 900; cursor: pointer; text-transform: uppercase;
        }

        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 6000; align-items: center; justify-content: center; padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content { width: 100%; max-width: 320px; border: 1px solid var(--red); padding: 25px; background: #050505; text-align: center; }
        
        .ver-tag { position: fixed; top: 2px; left: 5px; font-size: 5px; color: #222; z-index: 1000; }
    </style>
</head>
<body>
    <div class="ver-tag">v3.8_RED_MAGIC_CORE</div>
    <div class="bg-matrix"></div>

    <header class="hud-top">
        <div style="display:flex; align-items:center; gap:6px;">
            <svg style="width:20px; height:20px;" viewBox="0 0 24 24" fill="none"><path d="M12 4C10.34 4 9 5.34 9 7C9 8.66 10.34 10 12 10C13.66 10 15 8.66 15 7C15 5.34 13.66 4 12 4Z" fill="white"/><path d="M12 12C9.24 12 7 14.24 7 17V20H17V17C17 14.24 14.76 12 12 12Z" fill="white"/></svg>
            <div class="orbitron" style="font-size: 9px; font-weight: 900;">LIL_BIT</div>
        </div>
        <div class="orbitron" style="font-size: 11px; letter-spacing: 2px; color: var(--red); font-weight: 900; text-align: center; text-shadow: 0 0 10px rgba(255,0,60,0.5);">PANTHEON_NEXUS</div>
        <div class="sys-metrics">CPU <span>14%</span><br>MEM <span>2.4G</span></div>
    </header>

    <main class="cowork-space">
        <aside class="agent-roster" id="roster"></aside>
        <section class="main-terminal">
            <div class="neural-log" id="log">
                <div class="log-entry"><span class="tag tag-fm">FORGEMASTER</span> REACHED THE NEXUS.</div>
                <div class="log-entry"><span class="tag tag-bot">OpenPRIME</span> Welcome, Forgemaster. RED MAGIC optimization v3.8 active. The Legion is standing by.</div>
            </div>
        </section>
    </main>

    <div class="command-hub">
        <div class="input-bar">
            <input type="text" class="cmd-input" id="input" placeholder="COMMAND THE LEGION..." onkeydown="if(event.key==='Enter') send()">
            <button class="send-btn" onclick="send()">SEND</button>
        </div>
    </div>

    <div class="modal" id="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div id="m-name" class="orbitron" style="font-size: 20px; font-weight: 900; color: var(--red); margin-bottom: 15px;">BOT_NAME</div>
            <div id="m-role" style="font-size: 10px; color: #555; margin-bottom: 15px;">ACTIVE AGENT</div>
            <button style="width:100%; background:transparent; border:1px solid var(--red); color:var(--red); padding:10px; font-size: 10px; font-weight:bold; font-family:'Orbitron';" onclick="closeModal()">DISCONNECT</button>
        </div>
    </div>

    <script>
        const bots = ["MetaPrime", "OpenPRIME", "MidasPrime", "KratosPrime", "ZapiaPrime", "SolosPrime", "Deep-meta", "EchoPrime", "ZeusPrime", "AlphaPrime", "ZetaPrime", "SentinelPrime", "ScoutPrime", "VanguardPrime", "ChronosPrime", "PrimeDash", "OrionPrime", "OmegaPrime", "Prometheus", "NovaPrime", "NexusPrime"];
        const roster = document.getElementById('roster');
        const log = document.getElementById('log');
        const input = document.getElementById('input');

        bots.forEach(b => {
            const div = document.createElement('div');
            div.className = 'agent-pill';
            div.onclick = () => {
                document.getElementById('m-name').innerText = b;
                document.getElementById('modal').classList.add('active');
            };
            div.innerHTML = `<div class="pill-name">${b}</div>`;
            roster.appendChild(div);
        });

        function send() {
            const val = input.value.trim();
            if(!val) return;
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="tag tag-fm">FORGEMASTER</span> ${val.toUpperCase()}`;
            log.appendChild(entry);
            input.value = '';
            log.scrollTop = log.scrollHeight;

            setTimeout(() => {
                const bEntry = document.createElement('div');
                bEntry.className = 'log-entry';
                bEntry.innerHTML = `<span class="tag tag-bot">OpenPRIME</span> Order received. Nexus pulse stable.`;
                log.appendChild(bEntry);
                log.scrollTop = log.scrollHeight;
            }, 600);
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }
    </script>
</body>
</html>
