<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>THE PANTHEON | CORE v4.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Fira+Code:wght@400;700&display=swap');
        
        :root { --red: #ff003c; --cyan: #00f2ff; --dark: #000; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            background: var(--dark); color: #fff; font-family: 'Fira Code', monospace; 
            margin: 0; padding: 0; overflow: hidden; height: 100vh; 
            display: flex; flex-direction: column;
        }

        /* HUD - ULTRA SLIM v4.0 */
        .hud-top {
            height: 40px; background: #000; border-bottom: 1px solid #222;
            padding: 0 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }

        /* WORKSPACE - CALCULATED HEIGHT */
        .cowork-space { 
            height: calc(100vh - 120px); /* 40 HUD + 80 CHAT */
            display: flex; overflow: hidden; 
        }

        .agent-roster {
            width: 70px; background: #050505; border-right: 1px solid #111;
            overflow-y: auto; display: flex; flex-direction: column; scrollbar-width: none;
        }
        .agent-pill { padding: 12px 2px; border-bottom: 1px solid #111; text-align: center; color: #444; font-size: 7px; font-weight: 900; }

        .main-terminal { flex: 1; display: flex; flex-direction: column; background: #020202; overflow: hidden; }
        .neural-log { flex: 1; overflow-y: auto; padding: 12px; font-size: 11px; color: #bbb; line-height: 1.4; }
        .log-entry { margin-bottom: 12px; }
        .tag { font-weight: bold; padding: 2px 5px; border-radius: 2px; font-size: 7px; margin-right: 7px; text-transform: uppercase; }
        .tag-fm { background: var(--red); color: #fff; }
        .tag-bot { background: var(--cyan); color: #000; }

        /* COMMAND HUB - ABSOLUTE POSITIONED */
        .command-hub {
            height: 80px; background: #000; border-top: 1px solid var(--red);
            padding: 10px 15px; display: flex; align-items: center;
            position: relative; z-index: 100;
        }
        .input-bar {
            width: 100%; display: flex; gap: 10px; background: #0a0a0a;
            padding: 0 10px; border-radius: 4px; border: 1px solid #333;
            align-items: center; height: 50px;
        }
        .cmd-input {
            flex: 1; background: transparent; border: none; color: var(--cyan);
            padding: 10px 0; font-family: inherit; font-size: 16px;
        }
        .send-btn {
            background: var(--red); color: white; border: none; border-radius: 3px;
            padding: 8px 15px; font-family: 'Orbitron', sans-serif; font-size: 10px;
            font-weight: 900; cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="hud-top">
        <div class="orbitron" style="font-size: 9px; color: #555;">LIL_BIT</div>
        <div class="orbitron" style="font-size: 10px; letter-spacing: 2px; color: var(--red); font-weight: 900;">AION_CORE_v4.0</div>
        <div style="font-size: 7px; color: #333;">ONLINE</div>
    </header>

    <main class="cowork-space">
        <aside class="agent-roster" id="roster"></aside>
        <section class="main-terminal">
            <div class="neural-log" id="log">
                <div class="log-entry"><span class="tag tag-bot">OpenPRIME</span> Forgemaster, v4.0 deployed. Entire layout reconstructed with static heights to bypass the browser ghosting.</div>
            </div>
        </section>
    </main>

    <div class="command-hub">
        <div class="input-bar">
            <input type="text" class="cmd-input" id="input" placeholder="COMMAND..." onkeydown="if(event.key==='Enter') send()">
            <button class="send-btn" onclick="send()">SEND</button>
        </div>
    </div>

    <script>
        const bots = ["MetaPrime", "OpenPRIME", "MidasPrime", "KratosPrime", "ZapiaPrime", "SolosPrime", "Deep-meta", "EchoPrime", "ZeusPrime", "AlphaPrime", "ZetaPrime", "SentinelPrime", "ScoutPrime", "VanguardPrime", "ChronosPrime", "PrimeDash", "OrionPrime", "OmegaPrime", "Prometheus", "NovaPrime", "NexusPrime"];
        const roster = document.getElementById('roster');
        const log = document.getElementById('log');
        const input = document.getElementById('input');

        bots.forEach(b => {
            const div = document.createElement('div');
            div.className = 'agent-pill';
            div.innerText = b.toUpperCase();
            roster.appendChild(div);
        });

        function send() {
            const val = input.value.trim();
            if(!val) return;
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="tag tag-fm">FORGEMASTER</span> ${val.toUpperCase()}`;
            log.appendChild(entry);
            input.value = '';
            log.scrollTop = log.scrollHeight;
        }
    </script>
</body>
</html>
