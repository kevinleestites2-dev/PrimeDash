<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>THE PANTHEON | CORE v6.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Fira+Code:wght@400;700&display=swap');
        
        :root { 
            --red: #ff003c; --cyan: #00f2ff; --dark: #000; 
            --safe-bottom: env(safe-area-inset-bottom);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        html, body { 
            height: 100vh; width: 100vw; margin: 0; padding: 0; 
            background: var(--dark); color: #fff; font-family: 'Fira Code', monospace;
            overflow: hidden; position: fixed;
        }

        /* HUD */
        .hud-top {
            position: absolute; top: 0; left: 0; right: 0; height: 50px;
            background: #000; border-bottom: 2px solid var(--red);
            padding: 0 15px; display: flex; justify-content: space-between; align-items: center;
            z-index: 2000;
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }

        /* CONTAINER */
        .app-container {
            position: absolute; top: 50px; bottom: 90px; left: 0; right: 0;
            display: flex; overflow: hidden;
        }

        /* ROSTER */
        .agent-roster {
            width: 85px; background: #050505; border-right: 1px solid #1a1a1a;
            overflow-y: auto; display: flex; flex-direction: column; scrollbar-width: none;
        }
        .agent-pill { 
            padding: 18px 5px; border-bottom: 1px solid #111; text-align: center; 
            color: #444; font-size: 8px; font-weight: 900; cursor: pointer;
            transition: color 0.3s;
        }
        .agent-pill:active { color: var(--red); background: #111; }

        /* TERMINAL */
        .main-terminal { flex: 1; display: flex; flex-direction: column; background: #010101; overflow: hidden; }
        .neural-log { 
            flex: 1; overflow-y: auto; padding: 20px; font-size: 11px; color: #bbb; line-height: 1.6;
            display: flex; flex-direction: column; gap: 15px;
        }
        .log-entry { 
            width: 100%; border-left: 1px solid #222; padding-left: 12px; 
            white-space: pre-wrap; word-break: break-word;
        }
        
        .tag { font-weight: bold; padding: 2px 6px; border-radius: 2px; font-size: 7px; margin-right: 8px; text-transform: uppercase; display: inline-block; }
        .tag-fm { background: var(--red); color: #fff; }
        .tag-bot { background: var(--cyan); color: #000; }

        /* COMMAND HUB v6.0 */
        .command-hub {
            position: absolute; bottom: 0; left: 0; right: 0; height: 90px;
            background: #000; border-top: 1px solid var(--red);
            padding: 15px 15px calc(15px + var(--safe-bottom));
            z-index: 3000; display: flex; align-items: center;
        }
        .input-bar {
            width: 100%; display: flex; gap: 10px; background: #0a0a0a;
            padding: 0 12px; border-radius: 4px; border: 1px solid #333;
            align-items: center; height: 55px;
        }
        .cmd-input {
            flex: 1; background: transparent; border: none; color: var(--cyan);
            padding: 10px 0; font-family: inherit; font-size: 16px;
        }
        .send-btn {
            background: var(--red); color: white; border: none; border-radius: 3px;
            padding: 12px 18px; font-family: 'Orbitron', sans-serif; font-size: 11px;
            font-weight: 900; cursor: pointer; text-transform: uppercase;
        }

        /* MODAL */
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 5000; align-items: center; justify-content: center; padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content { 
            width: 100%; max-width: 320px; border: 1px solid var(--red); 
            padding: 30px; background: #050505; text-align: left;
            box-shadow: 0 0 50px rgba(255,0,60,0.2);
        }
    </style>
</head>
<body>
    <header class="hud-top">
        <div class="orbitron" style="font-size: 10px; color: #555;">LIL_BIT</div>
        <div class="orbitron" style="font-size: 11px; letter-spacing: 2px; color: var(--red); font-weight: 900;">AION_CORE_v6.0</div>
        <div style="font-size: 7px; color: var(--cyan);">SINGULARITY_ACTIVE</div>
    </header>

    <div class="app-container">
        <aside class="agent-roster" id="roster"></aside>
        <section class="main-terminal">
            <div class="neural-log" id="log">
                <div class="log-entry"><span class="tag tag-bot">OpenPRIME</span> Forgemaster, v6.0 Online. Fracture stabilization engaged. Reactive feedback protocols loaded. Roster logic integrated.</div>
            </div>
        </section>
    </div>

    <div class="command-hub">
        <div class="input-bar">
            <input type="text" class="cmd-input" id="input" placeholder="COMMAND THE LEGION..." onkeydown="if(event.key==='Enter') send()">
            <button class="send-btn" onclick="send()">SEND</button>
        </div>
    </div>

    <div class="modal" id="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div id="m-name" class="orbitron" style="font-size: 18px; color: var(--red); margin-bottom: 10px;">PRIME</div>
            <div id="m-data" style="font-size: 11px; color: #888; line-height: 1.5; margin-bottom: 20px;">ACCESSING CORE...</div>
            <button style="width:100%; background:var(--red); color:white; border:none; padding:12px; font-family:'Orbitron'; font-size:10px; font-weight:900;" onclick="closeModal()">CLOSE NEXUS</button>
        </div>
    </div>

    <script>
        const bots = ["MetaPrime", "OpenPRIME", "MidasPrime", "KratosPrime", "ZapiaPrime", "SolosPrime", "Deep-meta", "EchoPrime", "ZeusPrime", "AlphaPrime", "ZetaPrime", "SentinelPrime", "ScoutPrime", "VanguardPrime", "ChronosPrime", "PrimeDash", "OrionPrime", "OmegaPrime", "Prometheus", "NovaPrime", "NexusPrime"];
        const roster = document.getElementById('roster');
        const log = document.getElementById('log');
        const input = document.getElementById('input');

        bots.forEach(b => {
            const div = document.createElement('div');
            div.className = 'agent-pill';
            div.innerText = b.toUpperCase();
            div.onclick = () => showPrime(b);
            roster.appendChild(div);
        });

        function showPrime(name) {
            document.getElementById('m-name').innerText = name.toUpperCase();
            let data = "STATUS: ACTIVE\nSECTOR: CORE_LOGIC\nLOAD: NOMINAL";
            if(name === "MidasPrime") data = "TREASURY: SECURED\nASSETS: 21_BOT_EMPIRE\nFLOW: TRADE & LABOR ABSORBED";
            document.getElementById('m-data').innerText = data;
            document.getElementById('modal').classList.add('active');
        }

        function addLog(tag, type, msg) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="tag tag-${type}">${tag}</span> ${msg}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function send() {
            const val = input.value.trim();
            if(!val) return;
            addLog("FORGEMASTER", "fm", val.toUpperCase());
            input.value = '';

            setTimeout(() => {
                addLog("OpenPRIME", "bot", "PROCESSING COMMAND...");
                setTimeout(() => {
                    addLog("OpenPRIME", "bot", "ORDER RECEIVED. NEXUS PULSE STABLE. SIGNAL LOCKED.");
                }, 800);
            }, 400);
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }
    </script>
</body>
</html>
