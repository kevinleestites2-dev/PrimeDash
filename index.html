<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>THE PANTHEON | NEXUS v3.7</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Fira+Code:wght@400;700&display=swap');
        
        :root { 
            --red: #ff003c; --cyan: #00f2ff; --gold: #ffcc00; --dark: #000000; 
            --bg: #050505; --border: rgba(255, 0, 60, 0.8);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            background: var(--dark); color: #fff; font-family: 'Fira Code', monospace; 
            margin: 0; padding: 0; overflow: hidden; height: 100vh; 
            display: flex; flex-direction: column;
        }

        .bg-matrix { position: fixed; inset: 0; z-index: -1; background: #000; }

        /* HUD */
        .hud-top {
            background: #000; border-bottom: 2px solid var(--red);
            padding: 12px; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        
        .sys-metrics { font-size: 8px; color: #666; font-weight: bold; text-align: right; }
        .sys-metrics span { color: var(--cyan); }

        /* MAIN CONTENT AREA */
        .cowork-space { 
            flex: 1; display: flex; overflow: hidden; 
            position: relative;
        }

        /* SIDEBAR */
        .agent-roster {
            width: 80px; background: #080808; border-right: 1px solid #222;
            overflow-y: auto; display: flex; flex-direction: column; scrollbar-width: none;
        }
        .agent-roster::-webkit-scrollbar { display: none; }
        .agent-pill { padding: 12px 5px; border-bottom: 1px solid #111; cursor: pointer; text-align: center; color: #444; }
        .pill-name { font-size: 8px; font-weight: 900; letter-spacing: 1px; }

        /* TERMINAL LOG */
        .main-terminal { flex: 1; display: flex; flex-direction: column; background: #020202; position: relative; }
        
        .neural-log {
            flex: 1; overflow-y: auto; padding: 15px; font-size: 11px; color: #aaa;
            line-height: 1.5; padding-bottom: 120px; /* SPACE FOR FIXED CHAT */
        }
        .log-entry { margin-bottom: 12px; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .tag { font-weight: bold; padding: 2px 5px; border-radius: 2px; font-size: 7px; margin-right: 7px; text-transform: uppercase; }
        .tag-fm { background: var(--red); color: #fff; }
        .tag-bot { background: var(--cyan); color: #000; }

        /* PERSISTENT CHAT HUB - v3.7 HARD FIX */
        .command-hub {
            position: fixed; 
            bottom: 0; left: 0; right: 0;
            background: #000; 
            border-top: 2px solid var(--red);
            padding: 15px 15px calc(15px + env(safe-area-inset-bottom));
            z-index: 5000;
            box-shadow: 0 -10px 40px rgba(255,0,60,0.5);
        }
        .input-bar {
            display: flex; gap: 10px; background: #111;
            padding: 5px 15px; border-radius: 6px; border: 1px solid #333;
            align-items: center;
        }
        .cmd-input {
            flex: 1; background: transparent; border: none; color: var(--cyan);
            padding: 15px 0; font-family: inherit; font-size: 16px;
        }
        .send-btn {
            background: var(--red); color: white; border: none; border-radius: 4px;
            padding: 10px 15px; font-family: 'Orbitron', sans-serif; font-size: 10px;
            font-weight: 900; cursor: pointer; text-transform: uppercase;
        }

        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98);
            z-index: 6000; align-items: center; justify-content: center; padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content { width: 100%; max-width: 380px; border: 2px solid var(--red); padding: 30px; background: #050505; text-align: center; }
        
        .ver-tag { position: fixed; top: 2px; left: 5px; font-size: 6px; color: var(--red); z-index: 1000; font-weight: bold; }
    </style>
</head>
<body>
    <div class="ver-tag">v3.7_PERSISTENT_CORE</div>
    <div class="bg-matrix"></div>

    <header class="hud-top">
        <div style="display:flex; align-items:center; gap:8px;">
            <svg style="width:24px; height:24px;" viewBox="0 0 24 24" fill="none"><path d="M12 4C10.34 4 9 5.34 9 7C9 8.66 10.34 10 12 10C13.66 10 15 8.66 15 7C15 5.34 13.66 4 12 4Z" fill="white"/><path d="M12 12C9.24 12 7 14.24 7 17V20H17V17C17 14.24 14.76 12 12 12Z" fill="white"/></svg>
            <div class="orbitron" style="font-size: 11px; font-weight: 900;">LIL_BIT</div>
        </div>
        <div class="orbitron" style="font-size: 12px; letter-spacing: 2px; color: var(--red); font-weight: 900;">PANTHEON_NEXUS</div>
        <div class="sys-metrics">CPU<span>14%</span><br>RAM<span>2.4G</span></div>
    </header>

    <main class="cowork-space">
        <aside class="agent-roster" id="roster"></aside>
        <section class="main-terminal">
            <div class="neural-log" id="log">
                <div class="log-entry"><span class="tag tag-bot">OpenPRIME</span> Forgemaster, I have forced the chat interface to persist. It is now locked to the physical bottom of your screen.</div>
            </div>
        </section>
    </main>

    <div class="command-hub">
        <div class="input-bar">
            <input type="text" class="cmd-input" id="input" placeholder="MESSAGE THE LEGION..." onkeydown="if(event.key==='Enter') send()">
            <button class="send-btn" onclick="send()">SEND</button>
        </div>
    </div>

    <div class="modal" id="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div id="m-name" class="orbitron" style="font-size: 24px; font-weight: 900; color: var(--red); margin-bottom: 20px;">BOT_NAME</div>
            <button style="width:100%; background:var(--red); border:none; color:white; padding:15px; font-weight:bold;" onclick="closeModal()">CLOSE</button>
        </div>
    </div>

    <script>
        const bots = ["MetaPrime", "OpenPRIME", "MidasPrime", "KratosPrime", "ZapiaPrime", "SolosPrime", "Deep-meta", "EchoPrime", "ZeusPrime", "AlphaPrime", "ZetaPrime", "SentinelPrime", "ScoutPrime", "VanguardPrime", "ChronosPrime", "PrimeDash", "OrionPrime", "OmegaPrime", "Prometheus", "NovaPrime", "NexusPrime"];
        const roster = document.getElementById('roster');
        const log = document.getElementById('log');
        const input = document.getElementById('input');

        bots.forEach(b => {
            const div = document.createElement('div');
            div.className = 'agent-pill';
            div.onclick = () => {
                document.getElementById('m-name').innerText = b;
                document.getElementById('modal').classList.add('active');
            };
            div.innerHTML = `<div class="pill-name">${b}</div>`;
            roster.appendChild(div);
        });

        function send() {
            const val = input.value.trim();
            if(!val) return;
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="tag tag-fm">FORGEMASTER</span> ${val.toUpperCase()}`;
            log.appendChild(entry);
            input.value = '';
            log.scrollTop = log.scrollHeight;

            setTimeout(() => {
                const bEntry = document.createElement('div');
                bEntry.className = 'log-entry';
                bEntry.innerHTML = `<span class="tag tag-bot">OpenPRIME</span> Command recognized. Nexus sync complete.`;
                log.appendChild(bEntry);
                log.scrollTop = log.scrollHeight;
            }, 600);
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }
    </script>
</body>
</html>
