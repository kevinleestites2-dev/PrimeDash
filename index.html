<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PANTHEON v8.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { 
            height: 100vh; width: 100vw; 
            background: #000; color: #0f0; 
            font-family: monospace;
            overflow: hidden;
            display: flex; flex-direction: column;
        }
        header { height: 50px; border-bottom: 2px solid red; display: flex; align-items: center; padding: 0 10px; flex-shrink: 0; }
        main { flex-grow: 1; display: flex; overflow: hidden; }
        .side { width: 80px; border-right: 1px solid #333; overflow-y: auto; flex-shrink: 0; font-size: 8px; }
        .term { flex-grow: 1; overflow-y: auto; padding: 10px; font-size: 12px; }
        footer { 
            height: 100px; 
            background: #111; 
            border-top: 2px solid red; 
            display: flex; 
            align-items: center; 
            padding: 10px; 
            flex-shrink: 0;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .bar { width: 100%; display: flex; gap: 5px; }
        input { flex-grow: 1; height: 50px; background: #000; color: #0ff; border: 1px solid #444; padding: 0 10px; font-size: 18px; }
        button { width: 80px; background: red; color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header>AION_CORE_v8.0_RAW</header>
    <main>
        <div class="side" id="s"></div>
        <div class="term" id="l">SYSTEM_STABLE...</div>
    </main>
    <footer>
        <div class="bar">
            <input type="text" id="i" placeholder="TYPE...">
            <button onclick="send()">SEND</button>
        </div>
    </footer>
    <script>
        const b = ["MetaPrime", "OpenPRIME", "MidasPrime", "KratosPrime", "ZapiaPrime", "SolosPrime", "Deep-meta", "EchoPrime", "ZeusPrime", "AlphaPrime", "ZetaPrime", "SentinelPrime", "ScoutPrime", "VanguardPrime", "ChronosPrime", "PrimeDash", "OrionPrime", "OmegaPrime", "Prometheus", "NovaPrime", "NexusPrime"];
        const s = document.getElementById('s');
        b.forEach(n => { s.innerHTML += '<div style="padding:10px;border-bottom:1px solid #222">'+n+'</div>'; });
        function send() {
            const v = document.getElementById('i').value;
            if(!v) return;
            document.getElementById('l').innerHTML += '<div>> '+v+'</div>';
            document.getElementById('i').value = '';
        }
    </script>
</body>
</html>
