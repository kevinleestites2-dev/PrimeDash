<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>THE PANTHEON | v10.0 IRON_ANCHOR</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Fira+Code:wght@400;700&display=swap');
        :root { --red: #ff003c; --cyan: #00f2ff; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            height: 100%; width: 100%; 
            background: #000; color: #fff; 
            font-family: 'Fira Code', monospace;
            overflow: hidden; position: fixed;
        }

        header {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: #000; border-bottom: 2px solid var(--red);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; z-index: 10000; font-family: 'Orbitron', sans-serif;
        }

        main {
            position: absolute; top: 60px; bottom: 120px; left: 0; right: 0;
            display: flex; overflow: hidden; background: #000;
        }

        .sidebar {
            width: 90px; background: #050505; border-right: 1px solid #1a1a1a;
            overflow-y: auto; display: flex; flex-direction: column; scrollbar-width: none;
        }
        .bot-pill {
            padding: 20px 5px; border-bottom: 1px solid #111; color: #444;
            font-size: 8px; text-align: center; font-weight: 900; text-transform: uppercase;
        }
        .bot-pill:active { color: var(--red); background: #111; }

        .terminal {
            flex: 1; background: #020202; overflow-y: auto; padding: 20px;
            font-size: 11px; line-height: 1.5; color: #aaa;
        }

        footer {
            position: fixed; bottom: 0; left: 0; right: 0; height: 120px;
            background: #000; border-top: 2px solid var(--red);
            z-index: 10000; display: flex; align-items: flex-start;
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
        }

        .input-container {
            width: 100%; display: flex; gap: 12px; background: #0a0a0a;
            padding: 5px 15px; border: 1px solid #333; border-radius: 4px;
            height: 60px; align-items: center;
        }

        input {
            flex: 1; background: transparent; border: none; color: var(--cyan);
            font-size: 18px; font-family: inherit; height: 100%; outline: none;
        }

        button {
            background: var(--red); color: #fff; border: none; padding: 12px 20px;
            font-family: 'Orbitron'; font-weight: 900; border-radius: 3px; font-size: 12px;
        }

        .tag { padding: 2px 5px; font-size: 7px; font-weight: bold; margin-right: 8px; border-radius: 2px; }
        .tag-fm { background: var(--red); color: white; }
        .tag-bot { background: var(--cyan); color: black; }
        .entry { margin-bottom: 15px; }
    </style>
</head>
<body>
    <header>
        <div style="font-size: 9px; color: #444;">CORE_LOCKED</div>
        <div style="color: var(--red); font-size: 13px; letter-spacing: 2px; font-weight: 900;">AION_v10.0_IRON</div>
        <div onclick="location.reload(true)" style="font-size: 9px; border: 1px solid #333; padding: 5px; color: #666;">REFRESH</div>
    </header>

    <main>
        <div class="sidebar" id="sidebar"></div>
        <div class="terminal" id="terminal">
            <div class="entry"><span class="tag tag-bot">OpenPRIME</span> IRON_ANCHOR Protocol v10.0 Engaged. Viewport is fixed. Command Hub is physically locked to the bottom horizon.</div>
        </div>
    </main>

    <footer>
        <div class="input-container">
            <input type="text" id="cmdInput" placeholder="COMMAND..." autocomplete="off">
            <button onclick="sendCmd()">SEND</button>
        </div>
    </footer>

    <script>
        const bots = ["MetaPrime", "OpenPRIME", "MidasPrime", "KratosPrime", "ZapiaPrime", "SolosPrime", "Deep-meta", "EchoPrime", "ZeusPrime", "AlphaPrime", "ZetaPrime", "SentinelPrime", "ScoutPrime", "VanguardPrime", "ChronosPrime", "PrimeDash", "OrionPrime", "OmegaPrime", "Prometheus", "NovaPrime", "NexusPrime"];
        const sidebar = document.getElementById('sidebar');
        const terminal = document.getElementById('terminal');
        const input = document.getElementById('cmdInput');

        bots.forEach(b => {
            const div = document.createElement('div');
            div.className = 'bot-pill';
            div.innerText = b;
            div.onclick = () => logMsg("SYSTEM", "bot", `LINKING TO ${b.toUpperCase()}... CORE ACCESS GRANTED.`);
            sidebar.appendChild(div);
        });

        function logMsg(tag, type, msg) {
            const div = document.createElement('div');
            div.className = 'entry';
            div.innerHTML = `<span class="tag tag-${type}">${tag}</span> ${msg.toUpperCase()}`;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function sendCmd() {
            const val = input.value.trim();
            if(!val) return;
            logMsg("FORGEMASTER", "fm", val);
            input.value = '';

            setTimeout(() => {
                logMsg("OpenPRIME", "bot", "COMMAND CAPTURED. THE PANTHEON RESPONDS.");
            }, 500);
        }

        input.addEventListener("keypress", (e) => { if(e.key === "Enter") sendCmd(); });
    </script>
</body>
</html>
